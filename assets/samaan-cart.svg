<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Samaan cart management</title>
  <desc id="desc">Shopping cart with item list, promo code, and bill details.</desc>
  <rect width="900" height="560" fill="#fffaf4"/>
  <text x="88" y="76" fill="#202124" font-family="Arial, sans-serif" font-size="28" font-weight="800">Your Cart</text>
  <rect x="88" y="104" width="438" height="56" rx="12" fill="#eafff2" stroke="#b8f0ce"/>
  <text x="116" y="139" fill="#13a052" font-family="Arial, sans-serif" font-size="18" font-weight="700">Free delivery on orders above Rs250</text>
  <g fill="#fff" stroke="#efded2">
    <rect x="88" y="190" width="438" height="78" rx="14"/>
    <rect x="88" y="292" width="438" height="78" rx="14"/>
    <rect x="88" y="394" width="438" height="78" rx="14"/>
  </g>
  <g fill="#202124" font-family="Arial, sans-serif" font-size="20" font-weight="800">
    <text x="152" y="236">Red Chili Powder</text>
    <text x="152" y="338">Potato</text>
    <text x="152" y="440">Chana Dal</text>
  </g>
  <rect x="582" y="104" width="230" height="368" rx="18" fill="#ffffff" stroke="#efded2"/>
  <text x="612" y="154" fill="#202124" font-family="Arial, sans-serif" font-size="22" font-weight="800">Bill Details</text>
  <line x1="612" y1="304" x2="782" y2="304" stroke="#efded2"/>
  <text x="612" y="352" fill="#202124" font-family="Arial, sans-serif" font-size="24" font-weight="800">To Pay Rs275</text>
  <rect x="612" y="390" width="170" height="48" rx="12" fill="#ff7a2b"/>
  <text x="648" y="421" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="800">Checkout</text>
</svg>
