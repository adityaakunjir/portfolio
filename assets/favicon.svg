<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0d15"/>
      <stop offset="100%" stop-color="#05060b"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d8e0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#35d8e6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff0a5b" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <!-- Background with angled corners matching clip-path brand -->
  <polygon points="0,8 58,0 64,51 6,64" fill="url(#bg)" />
  <polygon points="0,8 58,0 64,51 6,64" fill="url(#glow)" />
  <!-- Border edge highlight -->
  <polygon points="0,8 58,0 64,51 6,64" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
  <!-- AK text -->
  <text x="32" y="40" text-anchor="middle" font-family="'Rajdhani','Arial Narrow',sans-serif" font-size="26" font-weight="900" fill="url(#mark)" letter-spacing="-0.5">AK</text>
</svg>
